<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Pose Studio (standalone)</title>
<style>
  html, body { margin:0; height:100%; background:#111; color:#ddd; font-family:sans-serif; overflow:hidden; }
  #host { position:fixed; inset:0; }
  #host > * { width:100%; height:100%; }
  #msg { position:fixed; left:8px; bottom:8px; font-size:12px; opacity:.7; z-index:9999; pointer-events:none; }
</style>
</head>
<body>
<div id="host"></div>
<div id="msg">Loading 3D model (~37 MB first time)…</div>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(console.warn);</script>
<script type="module">
  const { PoseStudioWidget } = await import("./extensions/ComfyUI_VNCCS_Utils/vnccs_pose_studio.js");
  // Fake "node": the widget only needs an id, a size, and a hidden pose_data widget holding JSON state.
  const node = { id: "standalone", size: [window.innerWidth, window.innerHeight],
                 widgets: [{ name: "pose_data", value: "{}" }, { name: "animation_image_batch", value: false }] };
  const studio = new PoseStudioWidget(node);
  window.studio = studio;
  document.getElementById("host").appendChild(studio.container);
  await studio._viewerInitPromise;
  studio.loadFromNode();
  node._vnccsPoseAwaitingRestore = false;
  await studio.loadModel();
  studio.resize();
  window.__studioReady = true;

  // --- Touch zoom (pinch) + zoom buttons, added for phones ---
  const viewer = studio.viewer, cv = viewer.canvas;
  const zoomBy = (scale) => {
    viewer.camera.position.sub(viewer.orbit.target).multiplyScalar(scale).add(viewer.orbit.target);
    viewer.orbit.update(); viewer.requestRender();
  };
  const pts = new Map(); let lastDist = 0;
  const dist = () => { const [a,b] = [...pts.values()]; return Math.hypot(a.x-b.x, a.y-b.y); };
  cv.addEventListener("pointerdown", e => { if (e.pointerType !== "touch") return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if (pts.size===2) lastDist = dist(); });
  cv.addEventListener("pointermove", e => {
    if (e.pointerType !== "touch" || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (pts.size===2) { const d = dist(); if (lastDist>0 && d>0) zoomBy(Math.min(1.15, Math.max(0.87, lastDist/d))); lastDist = d; }
  });
  const up = e => { pts.delete(e.pointerId); lastDist = 0; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  const mk = (txt, top, sc) => { const b = document.createElement("button"); b.textContent = txt;
    b.style.cssText = `position:fixed;left:8px;top:${top}px;width:44px;height:44px;font-size:26px;border-radius:22px;border:1px solid #888;background:rgba(30,30,40,.75);color:#fff;z-index:9998;touch-action:manipulation`;
    b.addEventListener("click", () => zoomBy(sc)); document.body.appendChild(b); };
  mk("+", 8, 0.8); mk("\u2212", 60, 1.25);
  document.getElementById("msg").remove();
  window.addEventListener("resize", () => { node.size = [innerWidth, innerHeight]; studio.resize(); });
</script>
</body>
</html>
